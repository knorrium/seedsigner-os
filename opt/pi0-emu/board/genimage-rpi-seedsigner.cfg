image boot.vfat {
  vfat {
    files = {
      "bcm2708-rpi-b.dtb",
      "bcm2708-rpi-b-plus.dtb",
      "bcm2708-rpi-zero-w.dtb",
      "bcm2708-rpi-zero.dtb",
      "rpi-firmware/bootcode.bin",
      "rpi-firmware/cmdline.txt",
      "rpi-firmware/config.txt",
      "rpi-firmware/fixup_x.dat",
      "rpi-firmware/start_x.elf",
      "rpi-firmware/overlays",
      "zImage"
    }
    label = "SEEDSIGNEMU"
  }
  size = 256M
}

# Persistent user-provided ROMs, saves, states, and RetroArch configuration.
image data.ext4 {
  ext4 {
    label = "seedsigner-roms"
    use-mke2fs = true
  }
  size = 512M
}

image seedsigner_os.img {
  hdimage {
  }

  partition boot {
    partition-type = 0xC
    bootable = "true"
    image = "boot.vfat"
  }

  partition data {
    partition-type = 0x83
    image = "data.ext4"
  }
}
